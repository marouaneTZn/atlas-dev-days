<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
      name="description"
      content="Inscrivez-vous aux Atlas Dev Days 2026."
    >

    <title>Atlas Dev Days 2026 | Inscription</title>

    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>

    <header>
      <nav class="navbar">
        <a href="index.html">
          <img
            src="assets/images/Atlas.png"
            alt="Logo Atlas Dev"
            class="logo"
          />
        </a>

        <ul class="nav-links">
          <li><a href="index.html">Accueil</a></li>
          <li><a href="programme.html">Programme</a></li>
          <li><a href="intervenants.html">Intervenants</a></li>
          <li><a href="inscription.html">Inscription</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="inscription-intro">
        <h1>Inscription</h1>

        <p>
          Inscrivez-vous aux Atlas Dev Days 2026 et participez à deux journées
          dédiées au développement web.
        </p>
      </section>

      <section class="inscription-content">
        
        <form action="#" method="post">
          <h2>Votre Informations</h2>
          
          <div class="form-group">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" name="nom" minlength="3" required>
          </div>

          <div class="form-group">
            <label for="email">Adresse e-mail</label>

            <input type="email" id="email" name="email" required>
          </div>

          <div class="form-group">
            <label for="telephone">Téléphone</label>

            <input
              type="tel"
              id="telephone"
              name="telephone"
              pattern="^(\+212|0)[5-7][0-9]{8}$"
              placeholder="0612345678"
              required
            >
          </div>

          <div class="form-group">
            <label for="profil">Votre profil</label>

            <select id="profil" name="profil" required>
              <option value="">Choisissez votre profil</option>

              <option value="etudiant">Étudiant</option>

              <option value="developpeur">Développeur</option>

              <option value="designer">Designer</option>

              <option value="entrepreneur">Entrepreneur</option>

              <option value="autre">Autre</option>
            </select>
          </div>

        </form>
      </section>
    </main>

    <footer>

    </footer>

  </body>
</html>
